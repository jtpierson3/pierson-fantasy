name: API Usage Rollup

on:
    schedule:
        - cron: '0 6 1 * *' # 6am UTC on the 1st of every month 
    workflow_dispatch: {} 

jobs: 
    rollup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            
            - name: Install dependencies
              run: pip install -r python/requirements.txt

            - name: Run API usage rollup
              env:
                APP_URL: https://pierson-fantasy.vercel.app
                SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
                VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
              run: python python/api_usage_rollup.py